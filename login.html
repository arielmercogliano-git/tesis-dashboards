<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesis · Acceso</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg: #080c14; --s1: #0d1220; --s3: #1a2235; --border: #1e2d45; --border2: #253550;
  --a1: #2563eb; --a2: #3b82f6; --a3: #60a5fa; --green: #10b981; --red: #ef4444;
  --text: #f1f5f9; --t2: #94a3b8; --t3: #475569; --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: var(--s1); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 380px; }
.logo { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.logo span { color: var(--a2); }
.sub { font-size: 12px; color: var(--t3); font-family: var(--mono); margin-bottom: 28px; }
label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--t3); margin-bottom: 6px; }
input { width: 100%; background: var(--s3); border: 1px solid var(--border2); border-radius: 8px; padding: 11px 14px; font-size: 14px; color: var(--text); font-family: var(--sans); outline: none; margin-bottom: 16px; }
input:focus { border-color: var(--a2); }
input#code { font-family: var(--mono); font-size: 22px; letter-spacing: 8px; text-align: center; }
button { width: 100%; background: var(--a1); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--sans); transition: background .15s; }
button:hover { background: var(--a2); }
button:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-size: 12px; margin-top: 14px; text-align: center; min-height: 16px; }
.msg.error { color: var(--red); }
.msg.ok { color: var(--green); }
.link { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: var(--t3); cursor: pointer; text-decoration: underline; }
.step { display: none; }
.step.active { display: block; }
.dashboards { display: none; flex-direction: column; gap: 8px; margin-top: 20px; }
.dashboards.active { display: flex; }
.dashboards a { display: block; padding: 12px 14px; background: var(--s3); border: 1px solid var(--border2); border-radius: 8px; color: var(--a3); text-decoration: none; font-size: 13px; font-weight: 500; }
.dashboards a:hover { border-color: var(--a2); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Tesis <span>·</span> Acceso</div>
  <div class="sub">Command Center &amp; Rentabilidad</div>

  <!-- Paso 1: pedir email -->
  <div class="step active" id="step-email">
    <label for="email">Tu email</label>
    <input type="email" id="email" placeholder="nombre@tesis.com" autocomplete="email">
    <button id="btn-request" onclick="pedirCodigo()">Enviarme un código</button>
    <div class="msg" id="msg-email"></div>
  </div>

  <!-- Paso 2: ingresar código -->
  <div class="step" id="step-code">
    <label for="code">Código de 6 dígitos</label>
    <input type="text" id="code" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
    <button id="btn-verify" onclick="verificarCodigo()">Ingresar</button>
    <div class="msg" id="msg-code"></div>
    <div class="link" onclick="volverAEmail()">← Usar otro email</div>
  </div>

  <!-- Paso 3: sesión activa -->
  <div class="step" id="step-ok">
    <div class="msg ok" style="font-size:14px;margin-top:0">✓ Sesión iniciada como <span id="email-ok"></span></div>
    <div class="dashboards active">
      <a href="tesis_command_center.html">📊 Command Center</a>
      <a href="rentabilidad_empleados.html">💼 Rentabilidad por Empleado</a>
    </div>
    <div class="link" onclick="cerrarSesion()">Cerrar sesión</div>
  </div>
</div>

<script>
const PROXY = 'https://bc-proxy-tesis-production.up.railway.app';
const API_KEY = 'A9L-ySuPiO-uy8o0ZzOfj3Bi7igRyMD2NsyRWwwesks';
const SESSION_KEY = 'tesis_session_token';
const SESSION_EMAIL_KEY = 'tesis_session_email';

function qs(id){ return document.getElementById(id); }
function showStep(id){ document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); qs(id).classList.add('active'); }
function setMsg(id, text, cls){ const el=qs(id); el.textContent=text; el.className='msg '+(cls||''); }

let emailActual = '';

async function pedirCodigo(){
  const email = qs('email').value.trim();
  if (!email || !email.includes('@')){ setMsg('msg-email','Ingresá un email válido','error'); return; }
  emailActual = email;
  qs('btn-request').disabled = true;
  setMsg('msg-email','Enviando…','');
  try{
    const r = await fetch(`${PROXY}/auth/request-code`, {
      method:'POST', headers:{'Content-Type':'application/json','x-api-key':API_KEY},
      body: JSON.stringify({ email })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error al pedir el código');
    setMsg('msg-email','','');
    showStep('step-code');
    qs('code').focus();
  }catch(e){
    setMsg('msg-email', e.message, 'error');
  }finally{
    qs('btn-request').disabled = false;
  }
}

async function verificarCodigo(){
  const code = qs('code').value.trim();
  if (!code || code.length < 6){ setMsg('msg-code','Ingresá el código completo','error'); return; }
  qs('btn-verify').disabled = true;
  setMsg('msg-code','Verificando…','');
  try{
    const r = await fetch(`${PROXY}/auth/verify-code`, {
      method:'POST', headers:{'Content-Type':'application/json','x-api-key':API_KEY},
      body: JSON.stringify({ email: emailActual, code })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Código inválido');
    localStorage.setItem(SESSION_KEY, d.token);
    localStorage.setItem(SESSION_EMAIL_KEY, emailActual);
    qs('email-ok').textContent = emailActual;
    showStep('step-ok');
  }catch(e){
    setMsg('msg-code', e.message, 'error');
  }finally{
    qs('btn-verify').disabled = false;
  }
}

function volverAEmail(){ showStep('step-email'); setMsg('msg-code','',''); qs('code').value=''; }
function cerrarSesion(){
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_EMAIL_KEY);
  qs('email').value=''; qs('code').value='';
  showStep('step-email');
}

// Si ya hay sesión guardada, saltamos directo al paso 3
(function initCheckSesion(){
  const tok = localStorage.getItem(SESSION_KEY);
  const email = localStorage.getItem(SESSION_EMAIL_KEY);
  if (tok && email){
    emailActual = email;
    qs('email-ok').textContent = email;
    showStep('step-ok');
  }
})();

qs('code').addEventListener('keydown', e => { if (e.key==='Enter') verificarCodigo(); });
qs('email').addEventListener('keydown', e => { if (e.key==='Enter') pedirCodigo(); });
</script>
</body>
</html>
